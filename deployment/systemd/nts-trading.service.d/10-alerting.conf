# Drop-in for the daemon unit (the unit itself is not in the repo).
# Install: mkdir -p ~/.config/systemd/user/nts-trading.service.d &&
#          cp this file there && systemctl --user daemon-reload
#
# Fires nts-alert@ when the unit enters "failed" — i.e. when Restart=
# gives up (start-limit hit) or the process exits without a restart
# policy. Ordinary crash→restart cycles do not reach "failed"; those are
# caught by the watchdog's NRestarts check instead.
[Unit]
OnFailure=nts-alert@%n.service
